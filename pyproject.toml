[project]
name = "afterprint-ai"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi[standard]==0.141.1", "pydantic>=2.11,<3", "httpx>=0.28,<1", "pypdf>=6,<7", "tenacity>=9,<10", "structlog>=25,<26"]
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12", "mypy>=1.17"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/afterprint_ai"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 110
